<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - No Encontrado</title>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2e;
            color: #cdd6f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: #313244;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.4);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #f38ba8; /* Acento rojo/rosado para indicar error */
            margin-bottom: 0.5rem;
            font-size: 4rem;
        }
        h2 {
            color: #cdd6f4;
            margin-bottom: 1rem;
            font-size: 1.5rem;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            color: #a6adc8;
        }
        .btn-back {
            display: inline-block;
            padding: 10px 20px;
            background-color: #89b4fa;
            color: #1e1e2e;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .btn-back:hover { background-color: #b4befe; }
    </style>
</head>
<body>

    <div class="container">
        <h1>404</h1>
        <h2>Ruta no encontrada</h2>
        <p>¡Ups! Parece que te has perdido en el servidor. La página que estás buscando no existe, fue movida o está fuera de servicio.</p>
        
        <a href="/" class="btn-back">← Volver a un lugar seguro</a>
    </div>

</body>
</html>
